# PR lane - blocking. Spec: docs/BUILD.md §10.4, docs/TESTING.md §5, §6 (budget < 10 min).
# Targets are the CANON.md matrix, ruled 2026-08-25: {Windows, Linux} x {x86-64, arm64}, all four
# on hosted native runners. Jobs that need code this repo does not have yet are declared and
# gated, never silently omitted: the determinism harness needs tl_driver (W1 runner+driver lane),
# queued in TODO.md. workflow_dispatch exists so a session branch can be proven green before it
# merges (external PRs are disabled on this repo, so pull_request alone cannot cover agent
# branches).
name: pr

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: doc audit
        run: python tools/docaudit/docaudit.py
      - name: docs/XREF.md is regenerated and committed
        run: git diff --exit-code -- docs/XREF.md
      - name: include firewall + header contracts
        run: python tools/audit/includes.py --root .
      - name: install the pinned clang major (the selftest and the cross-target gate need it)
        # clang 18 - ubuntu-24.04's default - CRASHES dumping record layouts for the
        # x86_64-pc-windows-msvc triple, which is half of the cross-target gate. This compiler is
        # not the one that produces binaries, so pinning it here is about capability, not about
        # docs/BUILD.md §9 R-7.
        run: |
          set -eu
          major=$(awk '$1=="clang"{split($2,v,"."); print v[1]}' toolchain/VERSIONS)
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$major"
          sudo apt-get install -y "llvm-$major" "lld-$major"
          echo "TL_CXX=clang++-$major" >> $GITHUB_ENV
          echo "TL_LLVM_BIN=/usr/lib/llvm-$major/bin" >> $GITHUB_ENV
      - name: audit selftest - the gates' own planted violations
        run: |
          python tools/audit/selftest.py --cxx "$TL_CXX"             --nm "$TL_LLVM_BIN/llvm-nm" --objdump "$TL_LLVM_BIN/llvm-objdump"             --ar "$TL_LLVM_BIN/llvm-ar"
      - name: cross-target divergence (preprocess + record layouts, four triples)
        run: python tools/audit/targets.py --root . --clang "$TL_CXX"
      - name: a src/<module>/ change touches that module's doc (or says [docs:none])
        # workflow_dispatch has no event base; fall back to the previous commit so the gate still
        # sees the head commit rather than silently passing an empty range.
        run: python tools/audit/commit_docs.py --base "${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}"

  build-test:
    strategy:
      fail-fast: false
      matrix:
        # The CANON.md target matrix on hosted native runners: {Windows, Linux} x {x86-64, arm64}.
        # The two arm64 legs are this repo's first-ever aarch64 executions - the fx trace pins
        # inside tl_tests are the cross-ISA determinism gate (docs/FX-PALETTE.md, fx_trace.test.cpp).
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, windows-11-arm]
        tier: [debug, dev, netcode, ship]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install clang + ninja (linux)
        if: runner.os == 'Linux'
        # libx11-dev: SDL3 (vendored, docs/BUILD.md §4, W2 vendor lane) hard-fails configure on
        # Linux when it finds neither X11 nor Wayland dev headers - this repo's CI runners carry
        # neither by default. X11 is the minimal, universally-available fix; a platform lane
        # adding native Wayland support installs libwayland-dev etc. then.
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build libx11-dev
      - name: install ninja (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: native LLVM present (windows-arm64)
        # Presence is not nativeness: an x64 clang-cl under emulation would default to the
        # x86_64 triple and build the wrong ISA. Measured with binarch on the compiler binary
        # itself (the same gate that later checks the build's output); install LLVM only when
        # clang-cl is absent or non-native, then re-measure - a still-non-native result is a
        # loud red, never a silent x64 leg.
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function NativeClangCl {
            $c = Get-Command clang-cl -ErrorAction SilentlyContinue
            if (-not $c) { return $false }
            (python tools/audit/binarch.py --file $c.Path --expect aarch64 | Out-Host); return ($LASTEXITCODE -eq 0)
          }
          if (-not (NativeClangCl)) {
            choco install llvm -y --no-progress
            Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
            $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
            if (-not (NativeClangCl)) { throw "no native arm64 clang-cl on this runner" }
          }
      - name: preset name
        shell: bash
        run: echo "PRESET=${{ matrix.tier }}-$([ '${{ runner.os }}' = 'Windows' ] && echo win || echo linux)" >> $GITHUB_ENV
      - name: toolchain pin (warning only - see docs/BUILD.md §9 R-7)
        shell: bash
        run: |
          set -eu
          pin=$(awk '$1=="clang"{print $2}' toolchain/VERSIONS)
          have=$(clang --version | head -1)
          echo "pinned $pin | runner $have"

      - name: configure
        # TL_STRICT_TOOLCHAIN=OFF: the runners carry stock clang, not the pinned major
        # (docs/BUILD.md §9 R-7). Turning this on is TODO.md's item once CI installs pinned LLVM;
        # the opt-out is explicit and lives here rather than being a silent default.
        run: cmake --preset ${{ env.PRESET }} -DTL_STRICT_TOOLCHAIN=OFF
      - name: build
        run: cmake --build --preset ${{ env.PRESET }}
      - name: binary matches the runner ISA (no silent host-arch fallback)
        # The win/linux presets carry no --target: they build whatever the host toolchain is. On
        # an arm64 runner an emulated x64 clang would quietly produce x86-64 binaries and this leg
        # would test the wrong ISA. Measured, not assumed.
        shell: bash
        run: python tools/audit/binarch.py --file "out/${{ env.PRESET }}/bin/tl_tests$([ '${{ runner.os }}' = 'Windows' ] && echo .exe)" --expect "$([ '${{ runner.arch }}' = 'ARM64' ] && echo aarch64 || echo x86_64)"
      - name: symbol audit
        run: cmake --build --preset ${{ env.PRESET }} --target tl_audit_symbols
      - name: unit tests
        # --timeout-ms 120000: docs/TESTING.md section 6's PR-lane value (ruled 2026-08-24). One
        # number serves because this job already runs --tag '!slow'; nightly runs without it.
        run: ./out/${{ env.PRESET }}/bin/tl_tests --isolate --tag '!slow' --timeout-ms 120000 --junit tl_tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ env.PRESET }}-${{ matrix.os }}
          path: tl_tests.xml
      - name: stage build_id for the four-way R-8 gate
        if: matrix.tier == 'netcode'
        uses: actions/upload-artifact@v4
        with:
          name: build-id-${{ matrix.os }}
          path: out/${{ env.PRESET }}/build_id.txt

  tier-parity:
    # docs/BUILD.md §3: netcode and ship must differ only by the stripping defines. Enforced by
    # comparing every resolved compile command, not the flag string a human wrote.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build libx11-dev
      # -DTL_STRICT_TOOLCHAIN=OFF: the runners carry stock clang, not the pinned major
      # (docs/BUILD.md §9 R-7). Every job that configures netcode or ship needs it; three of
      # them did not, and CI was red for three pushes.
      - run: cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
      - run: cmake --preset ship-linux -DTL_STRICT_TOOLCHAIN=OFF
      - run: python tools/audit/tier_parity.py --netcode out/netcode-linux --ship out/ship-linux

  build-id-cross-target:
    # R-8 says build_id is identical on every target. The selftest can only compare two command
    # lines someone typed; this job compares four real netcode builds of one checkout - one per
    # leg of the CANON.md target matrix, staged by build-test (tier == netcode). !cancelled():
    # a failed build-test leg must turn this gate RED via the count check below, not skip it -
    # a needs-skipped job reads as satisfied in branch protection.
    needs: [build-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-id-*
          path: ids
      - name: one build_id for every target (docs/BUILD.md §9 R-8, four legs)
        run: |
          set -eu
          ls ids/*/build_id.txt
          n=$(ls ids/*/build_id.txt | wc -l)
          [ "$n" -eq 4 ] || { echo "expected 4 build_id artifacts, found $n"; exit 1; }
          for f in ids/*/build_id.txt; do echo "$(dirname "$f"): $(cat "$f")"; done
          first=$(ls ids/*/build_id.txt | head -1)
          for f in ids/*/build_id.txt; do diff "$first" "$f"; done

  fingerprint-stability:
    # Two clean builds of the same tree must produce the same build_id (docs/BUILD.md §10.5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build libx11-dev
      - name: build twice, compare
        run: |
          set -eu
          cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
          cmake --build --preset netcode-linux
          cp out/netcode-linux/build_id.txt first.txt
          rm -rf out/netcode-linux
          cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
          cmake --build --preset netcode-linux
          diff first.txt out/netcode-linux/build_id.txt

  sanitizers:
    # Both Linux ISAs: UBSan findings can be arch-specific (alignment, shift lowering), and the
    # sanitizer build is Linux-only by construction (TL_SANITIZE under clang-cl is FATAL_ERROR).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build libx11-dev
      - run: cmake --preset sanitize-linux
      - run: cmake --build --preset sanitize-linux
      - run: ./out/sanitize-linux/bin/tl_tests --tag '!slow'

  rebuild-budget:
    # Cold, no compiler cache (docs/BUILD.md §9 R-1). The CI box has its own budget; the numbers
    # in docs/BUILD.md §3 are the reference PC's.
    # Runs on the ELECTED leg (ubuntu-latest, WORKFLOW.md §4) — ruled 2026-08-26: four
    # windows-latest runs on one tree measured full builds of 9.90/10.34/14.38/25.27 s (a 2.5x
    # fleet spread; the 25.27 turned a docs-only push red), while the x64 ubuntu fleet measured
    # as uniform EPYC 7763 silicon in the perf election. A wall-clock gate needs the steady
    # fleet. Measurement record in TODO.md (the rebuild-budget ruling, 2026-08-26).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build libx11-dev
      - run: python tools/rebuild_budget.py --preset netcode-linux --strict-toolchain off --full-budget 25 --incremental-budget 5
        # The CI box's own budget, passed explicitly as the tool's contract requires (it must
        # never inherit the reference PC's docs/BUILD.md numbers). PROVISIONAL at the leg move
        # (2026-08-26): one measured ubuntu build of this tree took 12.1 s; 25/5 keeps a 2x
        # regression visible while ~10 runs of TSV data accumulate, then the budget tightens to
        # measured median x 1.15 by the standing TODO.md entry.

