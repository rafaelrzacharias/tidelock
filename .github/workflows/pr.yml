# PR lane - blocking. Spec: docs/BUILD.md §10.4, docs/TESTING.md §5, §6 (budget < 10 min).
# Jobs that need hardware or code this repo does not have yet are declared and gated, never
# silently omitted: cross-pi4 needs the R-3 sysroot (docs/BUILD.md §9), the determinism harness
# needs tl_driver (W1 runner+driver lane). Both are queued in TODO.md.
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: doc audit
        run: python tools/docaudit/docaudit.py
      - name: docs/XREF.md is regenerated and committed
        run: git diff --exit-code -- docs/XREF.md
      - name: include firewall + header contracts
        run: python tools/audit/includes.py --root .
      - name: install the pinned clang major (the selftest and the cross-target gate need it)
        # clang 18 - ubuntu-24.04's default - CRASHES dumping record layouts for the
        # x86_64-pc-windows-msvc triple, which is half of the cross-target gate. This compiler is
        # not the one that produces binaries, so pinning it here is about capability, not about
        # docs/BUILD.md §9 R-7.
        run: |
          set -eu
          major=$(awk '$1=="clang"{split($2,v,"."); print v[1]}' toolchain/VERSIONS)
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh "$major"
          sudo apt-get install -y "llvm-$major" "lld-$major"
          echo "TL_CXX=clang++-$major" >> $GITHUB_ENV
          echo "TL_LLVM_BIN=/usr/lib/llvm-$major/bin" >> $GITHUB_ENV
      - name: audit selftest - the gates' own planted violations
        run: |
          python tools/audit/selftest.py --cxx "$TL_CXX"             --nm "$TL_LLVM_BIN/llvm-nm" --objdump "$TL_LLVM_BIN/llvm-objdump"             --ar "$TL_LLVM_BIN/llvm-ar"
      - name: cross-target divergence (preprocess + record layouts, three triples)
        run: python tools/audit/targets.py --root . --clang "$TL_CXX"
      - name: a src/<module>/ change touches that module's doc (or says [docs:none])
        run: python tools/audit/commit_docs.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        tier: [debug, dev, netcode, ship]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: install clang + ninja (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: install ninja (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: preset name
        shell: bash
        run: echo "PRESET=${{ matrix.tier }}-$([ '${{ runner.os }}' = 'Windows' ] && echo win || echo linux)" >> $GITHUB_ENV
      - name: toolchain pin (warning only - see docs/BUILD.md §9 R-7)
        shell: bash
        run: |
          set -eu
          pin=$(awk '$1=="clang"{print $2}' toolchain/VERSIONS)
          have=$(clang --version | head -1)
          echo "pinned $pin | runner $have"

      - name: configure
        # TL_STRICT_TOOLCHAIN=OFF: the runners carry stock clang, not the pinned major
        # (docs/BUILD.md §9 R-7). Turning this on is TODO.md's item once CI installs pinned LLVM;
        # the opt-out is explicit and lives here rather than being a silent default.
        run: cmake --preset ${{ env.PRESET }} -DTL_STRICT_TOOLCHAIN=OFF
      - name: build
        run: cmake --build --preset ${{ env.PRESET }}
      - name: symbol audit
        run: cmake --build --preset ${{ env.PRESET }} --target tl_audit_symbols
      - name: unit tests
        # --timeout-ms 120000: docs/TESTING.md section 6's PR-lane value (ruled 2026-08-24). One
        # number serves because this job already runs --tag '!slow'; nightly runs without it.
        run: ./out/${{ env.PRESET }}/bin/tl_tests --isolate --tag '!slow' --timeout-ms 120000 --junit tl_tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ env.PRESET }}
          path: tl_tests.xml

  tier-parity:
    # docs/BUILD.md §3: netcode and ship must differ only by the stripping defines. Enforced by
    # comparing every resolved compile command, not the flag string a human wrote.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      # -DTL_STRICT_TOOLCHAIN=OFF: the runners carry stock clang, not the pinned major
      # (docs/BUILD.md §9 R-7). Every job that configures netcode or ship needs it; three of
      # them did not, and CI was red for three pushes.
      - run: cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
      - run: cmake --preset ship-linux -DTL_STRICT_TOOLCHAIN=OFF
      - run: python tools/audit/tier_parity.py --netcode out/netcode-linux --ship out/ship-linux

  build-id-win:
    # R-8 says build_id is identical on every target. The selftest can only compare two command
    # lines someone typed; these three jobs compare two real builds of one checkout.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: choco install ninja -y
      - run: cmake --preset netcode-win -DTL_STRICT_TOOLCHAIN=OFF
      - run: cmake --build --preset netcode-win
      - uses: actions/upload-artifact@v4
        with: { name: build-id-win, path: out/netcode-win/build_id.txt }

  build-id-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - run: cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
      - run: cmake --build --preset netcode-linux
      - uses: actions/upload-artifact@v4
        with: { name: build-id-linux, path: out/netcode-linux/build_id.txt }

  build-id-cross-target:
    needs: [build-id-win, build-id-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: build-id-win, path: win }
      - uses: actions/download-artifact@v4
        with: { name: build-id-linux, path: linux }
      - name: one build_id for every target (docs/BUILD.md §9 R-8)
        run: |
          set -eu
          echo "win:   $(cat win/build_id.txt)"
          echo "linux: $(cat linux/build_id.txt)"
          diff win/build_id.txt linux/build_id.txt

  fingerprint-stability:
    # Two clean builds of the same tree must produce the same build_id (docs/BUILD.md §10.5).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: build twice, compare
        run: |
          set -eu
          cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
          cmake --build --preset netcode-linux
          cp out/netcode-linux/build_id.txt first.txt
          rm -rf out/netcode-linux
          cmake --preset netcode-linux -DTL_STRICT_TOOLCHAIN=OFF
          cmake --build --preset netcode-linux
          diff first.txt out/netcode-linux/build_id.txt

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - run: cmake --preset sanitize-linux
      - run: cmake --build --preset sanitize-linux
      - run: ./out/sanitize-linux/bin/tl_tests --tag '!slow'

  rebuild-budget:
    # Cold, no compiler cache (docs/BUILD.md §9 R-1). The CI box has its own budget; the numbers
    # in docs/BUILD.md §3 are the reference PC's.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: choco install ninja -y
      - run: python tools/rebuild_budget.py --preset netcode-win --strict-toolchain off --full-budget 25 --incremental-budget 5
        # The CI box's own budget, passed explicitly as the tool's contract requires (it must
        # never inherit the reference PC's docs/BUILD.md numbers). Re-baselined 2026-08-24 at
        # the W1 wave merge: the tree grew from 13 placeholder TUs to the full W1 foundation
        # and measured 12.46 s full on this runner; 25/5 keeps a 2x regression visible.

  cross-pi4:
    # Build-only aarch64 leg. Runs once the sysroot tarball of docs/BUILD.md §9 R-3 exists and
    # its URL is set as the repository variable TL_SYSROOT_URL; until then it is skipped, not
    # red. TODO.md carries the ruling request.
    if: vars.TL_SYSROOT_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: sudo apt-get update && sudo apt-get install -y clang lld llvm ninja-build
      - name: fetch the pinned sysroot and verify its hash
        run: |
          set -eu
          curl -fsSL "${{ vars.TL_SYSROOT_URL }}" -o sysroot.tar.gz
          python tools/audit/sysroot_hash.py --tarball sysroot.tar.gz --versions toolchain/VERSIONS --key sysroot_pi4
          mkdir -p out/sysroot/pi4 && tar -xzf sysroot.tar.gz -C out/sysroot/pi4
      - run: cmake --preset netcode-pi4 -DTL_SYSROOT=$PWD/out/sysroot/pi4
      - run: cmake --build --preset netcode-pi4
      - run: file out/netcode-pi4/bin/tl_tests | grep -q aarch64
